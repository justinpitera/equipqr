<!doctype html>
<html lang="en">
	<head>
		<title>Fejlmelings</title>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="full-screen" content="yes">
		<meta name="apple-mobile-web-app-title" content="Fejlmelings">
		<link rel="manifest" href="manifest.webmanifest" />
		<script>
			const html = document.querySelector('html');
			if (html && localStorage.getItem('darkModeEnabled') === 'true') html.style.filter = 'invert(1)';
			const originalWarn = console.warn;
			console.warn = (...data) => {
				if (data[0].includes('read reactive state that was not visible to the compiler. Updates to this state will not cause the statement to re-run. The behaviour of this code will change if you migrate it to runes mode')) return;
				originalWarn(...data);
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
