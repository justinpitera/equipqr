services:
  postgres:
    image: postgres:latest
    container_name: fejlmelings-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USERNAME}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DATABASE}"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - fejlmelings-storage:/var/lib/postgresql/data

volumes:
  fejlmelings-storage:
