[project]
name = "api"
version = "2024.11.22-rev0"
description = "Backend API for Fejlmelings app"
authors = [
    { name = "Justin N. Pitera", email = "justinpitera@gmail.com" }
]
dependencies = [
    "tortoise-orm>=0.22.0",
    "starlette>=0.41.3",
    "orjson>=3.10.11",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.10.0",
    "pandas>=2.2.3",
]
requires-python = ">= 3.12.6"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "black>=24.10.0",
    "aerich>=0.7.2",
]

[tool.black]
line-length = 220
target-version = ["py312"] 

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.rye.scripts]
start = "python -m src.main"

[tool.aerich]
tortoise_orm = "src.TORTOISE_CONFIG"
location = "./migrations"
src_folder = "./."
