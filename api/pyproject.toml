[project]
name = "api"
version = "2024.11.22-rev0"
description = "Backend API for Fejlmelings app"
authors = [
    { name = "Justin N. Pitera", email = "justinpitera@gmail.com" }
]
dependencies = [
    "tortoise-orm>=0.22.0",
    "starlette>=0.41.3",
    "orjson>=3.10.12",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.10.0",
    "pandas>=2.2.3",
    "toml>=0.10.2",
    "asyncpg>=0.30.0",
    "granian[pname]>=1.6.4",
    "colorama>=0.4.6",
    "loguru>=0.7.2",
    "qrcode>=8.0",
    "tqdm>=4.67.1",
    "pillow>=11.0.0",
    "celery[redis]>=5.4.0",
    "minio>=7.2.12",
    "requests>=2.32.3",
    "python-multipart>=0.0.19",
    "pandas-stubs>=2.2.3.241126",
    "pyotp>=2.9.0",
    "itsdangerous>=2.2.0",
    "pydantic[email]>=2.10.3",
    "celery-stubs>=0.1.3",
    "celery-types>=0.22.0",
    "faker>=33.1.0",
    "types-requests>=2.32.0.20241016",
    "types-toml>=0.10.8.20240310",
    "types-tortoise>=0.3.6",
]
requires-python = ">= 3.12.6"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "black>=24.10.0",
    "aerich>=0.7.2",
]

[tool.black]
line-length = 220
target-version = ["py312"] 

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.rye.scripts]
start = "python -m src.main"
gen_stubs = "python ../scripts/stubgenerator.py"


[tool.aerich]
tortoise_orm = "src.TORTOISE_CONFIG"
location = "./migrations"
src_folder = "./."
